[project]
name = "vuln-dbn"
version = "0.1.0"
description = "Dynamic Bayesian network structure learning over natural commit-history change-type slices"
requires-python = ">=3.12"
dependencies = [
    "pgmpy>=1.0.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "networkx>=3.2",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.scripts]
vuln-dbn = "vuln_dbn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_dbn"]
